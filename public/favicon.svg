<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B87355" />
      <stop offset="50%" stop-color="#9E5234" />
      <stop offset="100%" stop-color="#4E3629" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E3629" />
      <stop offset="100%" stop-color="#B87355" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4E3629" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Elegant Letter 'C' -->
  <path d="M 380,170
           C 330,110 200,100 130,190
           C 60,280 100,380 180,420
           C 250,455 350,410 380,360" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="36" 
        stroke-linecap="round"
        filter="url(#softGlow)"/>

  <!-- Elegant Letter 'A' -->
  <path d="M 256,90 L 140,430" 
        fill="none" 
        stroke="url(#secondaryGrad)" 
        stroke-width="34" 
        stroke-linecap="round"
        filter="url(#softGlow)"/>
        
  <path d="M 256,90 L 372,430" 
        fill="none" 
        stroke="url(#secondaryGrad)" 
        stroke-width="34" 
        stroke-linecap="round"
        filter="url(#softGlow)"/>
        
  <!-- Crossbar of 'A' -->
  <path d="M 180,310 L 332,310" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="28" 
        stroke-linecap="round"
        filter="url(#softGlow)"/>

  <!-- Decorative Accents for Luxury Look -->
  <!-- Top Sparkle / Mind concept -->
  <path d="M 256,20 Q 256,50 286,50 Q 256,50 256,80 Q 256,50 226,50 Q 256,50 256,20 Z" fill="#B87355" />
  
  <!-- Curves endings details -->
  <circle cx="380" cy="170" r="18" fill="#4E3629"/>
  <circle cx="380" cy="360" r="18" fill="#4E3629"/>
</svg>
